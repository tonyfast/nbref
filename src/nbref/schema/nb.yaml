type: object
readOnly: true
$id: https://deathbeds.github.io/nbref/schema/nb.yaml
$ref: "#/$defs/nb"
# contentMediaType: application/ipynb+json
$defs:
    mimetypes:
        # the mimetypes should be dynamically extensible
        properties:
            text/plain:
                contentMediaType: text/plain
            text/markdown:
                contentMediaType: text/markdown
            text/html:
                contentMediaType: text/html
            image/png:
                contentMediaType: image/png
            image/jpeg:
                contentMediaType: image/jpeg  
            image/svg+xml:
                contentMediaType: image/svg+xml
            application/javascript:
                contentMediaType: application/javascript
            application/json:
                contentMediaType: application/json
            application/x-ipynb+json:
                contentMediaType: application/x-ipynb+json
            text/uri-list:
                contentMediaType: text/uri-list
            application/ipynb+json:
                $ref: "#"
        additionalProperties: {}
    metadata:
        parent:
            role: dialog
        type: object
        properties:
            title: 
                type: string
                "@type": dcterms:title 
            description: 
                type: string
                "@type": dcterms:description
    nb:
        parent:
            role: main
        title: document
        required: [cells, metadata, nbformat, nbformat_minor]
        properties:
            nbformat: 
                type: integer
            nbformat_minor: 
                type: integer
            
            metadata: 
                $ref: "#/$defs/metadata"
                properties:
                    kernelspec: 
                        type: object
                    language_info:
                        type: object
                        properties:
                            codemirror_mode:
                                type: object
            cells:
                type: array
                title: cells
                items:
                    title: cell
                    tags: [cell]
                    required: [id, execution_count, cell_type, source, outputs]
                    attrs: 
                        role: none
                    properties:
                        attachments:
                            type: object
                            parent:
                                role: dialog
                            additionalProperties:
                                $ref: "#/$defs/mimetypes"
                        id: 
                            type: string
                            class: [hidden]
                            "@type": "@id"
                        cell_type:
                            enum: [code, markdown, raw, file]
                            "@type": rdfs:label
                        execution_count:
                            title: execution count
                            type: integer
                            default: -1
                        source:
                            type: [string, array]
                            role: textbox
                            aria:
                                multiline: true
                            parent:
                                role: group
                            style:
                                width: 100%
                        metadata: 
                            role: dialog
                            $ref: "#/$defs/metadata"
                        outputs:
                            type: array
                            readOnly: true
                            items:
                                title: output
                                type: object
                                tags: [output]
                                required: [output_type]
                                properties:
                                    # "@index": 
                                    #     role: link
                                    #     title: output
                                    #     type: integer
                                    #     readOnly: true
                                    output_type: 
                                        type: string
                                    data:
                                        $ref: "#/$defs/mimetypes"
                                    traceback:
                                        type: string
                                        format: ascii
                                    text:
                                        type: string
                                        format: ascii
                                    metadata:
                                        $ref: "#/$defs/metadata"
