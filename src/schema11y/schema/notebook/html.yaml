$dynamicAnchor: notebook
type: object
contentMediaType: "application/x-ipynb+json"
$ref: types.yaml
properties:
  metadata:
    type: object
    allOf:
    - required: [title, description, authors, updated_at, created_at]
      properties:
          title: 
            type: string
            default: ""
          description:
            type: string
            default: ""
          authors:
            type: array
            items:
              type: string
            default: []
          updated_at:
            type: string
            format: date-time
            default: ""
          created_at:
            type: string
            format: date-time
            default: ""
    - unevaluatedProperties: true
      parent:
        title: runtime, language, and other information
        role: group
        aria:
          expanded: false
  cells:
    description: The cells of the notebook.
    type: array
    items:
      $ref: '#/$defs/cell'
  nbformat: {}
  nbformat_minor: {}
additionalProperties: false
$defs:
  cell:
    parent: 
        role: group
    tags: [cell]
    allOf:
      - parent: false
        role: toolbar
        properties:
          id:
            "@type": "@id"
          cell_type: 
            enum:
              - code
              - markdown
              - raw
              - unknown
          execution_count: {}
      - parent: false
        properties:
          source:
            parent:
              role: group
            role: textbox
            contentSchema:
              role: code
            aria:
              multiline: true
          metadata:
            parent: 
              role: dialog
          attachments:
            parent:
              role: dialog
            additionalProperties: 
              $ref: content.yaml
          outputs:
            parent: 
              role: group
            items:
              $ref: '#/$defs/output'
  output:
    type: object
    properties:
      output_type:
        description: The type of the output.
        enum:
          - execute_result
          - display_data
          - stream
          - error
      data:
        $ref: content.yaml
      metadata:
        parent:
          role: dialog
      text:
        tagName: samp
      name:
        tagName: span
      ename:
        role: paragraph
      evalue:
        description: The error value of the output.
        type: string
      traceback:
        description: The traceback of the output.
        type: array
        items:
          type: string